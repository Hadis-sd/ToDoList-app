<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<body>
    <div class="container">
        <h1>To Do List</h1>
        <form id="item-form">
            <input class="input" type="text" placeholder="add your task">
            <button type="submit" id="add-button">
                <i class="fa fa-add"></i>
            </button>
        </form>
        <div class="empty-input"></div>
        <div class="task-lists-container">
            <img id="empty-img" src="empty_vector.png" alt="empty list">

            <ul class="task-lists">
            </ul>
        </div>
        <button type="reset" class="clear-all">clear all</button>

        <div class="success-modal">
            <div class="success-box">
                
                <h2> Congratulations!</h2>
                <p>You completed all your tasks!</p>
                
                <button class="close-modal">Awesome</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
